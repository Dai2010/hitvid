name: Debian package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-deb:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Calculate package version
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+git.${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build in Debian 11
        env:
          HITVID_VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker run --rm --platform linux/amd64 \
            -e HITVID_VERSION \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            debian:11 \
            bash -euxo pipefail -c '
              echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
              printf "%s\n" "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl xz-utils
              curl -fsSL https://go.dev/dl/go1.24.5.linux-amd64.tar.gz -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH=/usr/local/go/bin:$PATH
              go version
              ./scripts/build-deb.sh
              chown "$HOST_UID:$HOST_GID" dist/*.deb
            '

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          test "$(dpkg-deb --field dist/*.deb Architecture)" = amd64

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: hitvid-deb-${{ steps.package.outputs.version }}
          path: dist/*.deb
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          pattern: hitvid-deb-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.deb --clobber
          else
            gh release create "$TAG_NAME" dist/*.deb \
              --title "$TAG_NAME" \
              --generate-notes
          fi
