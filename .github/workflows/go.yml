name: Go

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run . -help
      - run: go build -o hitvid .
      # arm64 is a supported native target now, so probe one that is not.
      - name: Check unsupported native target package setup
        run: GOOS=linux GOARCH=arm CGO_ENABLED=1 go test -c -tags native -o /tmp/hitvid-arm.test
